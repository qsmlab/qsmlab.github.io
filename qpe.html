<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Quantum Phase Estimation Visualizer</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:#f4f4f4;
text-align:center;
}

.container{
width:80%;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

canvas{
max-width:1000px;
max-height:600px;
margin:auto;
}

input{
width:80px;
padding:5px;
margin:5px;
}

button{
padding:6px 14px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<h2>Quantum Phase Estimation Probability</h2>

n
<input type="number" id="n" value="3">

θ
<input type="number" id="theta" value="0.37" step="0.01">

<button onclick="compute()">Compute</button>

<p id="info"></p>

<canvas id="chart"></canvas>

</div>

<script>

let chart;

function probability(k,n,theta){

let numerator = Math.sin(Math.PI*(Math.pow(2,n)*theta - k))**2;
let denom = Math.sin(Math.PI*(theta - k/Math.pow(2,n)))**2;

if(Math.abs(denom) < 1e-12) return 1;

return numerator/(Math.pow(2,2*n)*denom);
}

function compute(){

let n=parseInt(document.getElementById("n").value);
let theta=parseFloat(document.getElementById("theta").value);

let N=Math.pow(2,n);

let barData=[];
let barPoints=[];

for(let k=0;k<N;k++){

barPoints.push({x:k,y:probability(k,n,theta)});

}

let smoothPoints=[];

for(let x=0;x<N;x+=0.02){

smoothPoints.push({x:x,y:probability(x,n,theta)});

}

let peak = Math.pow(2,n)*theta;

document.getElementById("info").innerHTML =
"2ⁿθ = "+peak.toFixed(3)+" → Peak near k ≈ "+Math.round(peak);

if(chart) chart.destroy();

chart = new Chart(document.getElementById("chart"),{

data:{

datasets:[

{
type:'line',
data:smoothPoints,
pointRadius:0,
borderWidth:2,
fill:false
},

{
type:'bar',
data:barPoints
}

]

},

options:{

responsive:true,

scales:{
x:{
type:'linear',
min:0,
max:N
},
y:{
beginAtZero:true,
max:1
}
}

}

});

}

compute();

</script>

</body>
</html>
