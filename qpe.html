<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>QPE Probability Visualizer</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
font-family:Arial;
text-align:center;
background:#f5f5f5;
}

.container{
width:60%;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input{
width:80px;
padding:5px;
margin:10px;
}

button{
padding:8px 15px;
font-size:15px;
cursor:pointer;
}

canvas{
margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<h2>Quantum Phase Estimation Probability</h2>

<label>Number of qubits (n):</label>
<input type="number" id="n" value="3">

<label>Phase θ :</label>
<input type="number" id="theta" value="0.37" step="0.01">

<br>

<button onclick="calculate()">Compute</button>

<canvas id="plot"></canvas>

</div>

<script>

let chart;

function probability(k,n,theta){

let numerator = Math.sin(Math.PI*(Math.pow(2,n)*theta - k))**2;

let denom = Math.sin(Math.PI*(theta - k/Math.pow(2,n)))**2;

if(denom === 0) return 1;

return numerator/(Math.pow(2,2*n)*denom);
}

function calculate(){

let n = parseInt(document.getElementById("n").value);
let theta = parseFloat(document.getElementById("theta").value);

let N = Math.pow(2,n);

let labels=[];
let data=[];

for(let k=0;k<N;k++){

labels.push(k);

data.push(probability(k,n,theta));

}

if(chart) chart.destroy();

chart = new Chart(document.getElementById("plot"),{

type:"bar",

data:{
labels:labels,
datasets:[{
label:"Measurement Probability",
data:data
}]
},

options:{
scales:{
y:{beginAtZero:true,max:1}
}
}

});

}

calculate();

</script>

</body>
</html>
